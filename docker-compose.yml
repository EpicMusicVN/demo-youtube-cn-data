version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cnl-postgres
    environment:
      POSTGRES_USER: cnl
      POSTGRES_PASSWORD: cnlpass
      POSTGRES_DB: cnldb
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  youtube-data:
    build: .
    container_name: youtube-data
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cnl:cnlpass@postgres:5432/cnldb
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
