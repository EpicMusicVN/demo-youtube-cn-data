<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restricted — EMVN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <header class="site-header">
      <div class="brand">EMVN</div>
      <div class="brand-subtitle">Restricted</div>
    </header>

    <main class="shell">
      <section class="lock-screen">
        <div class="card lock-card">
          <h2>Enter access code</h2>
          <p class="muted">This page is restricted. Enter the access code to continue.</p>
          <form method="POST" action="{{ action_url }}">
            <div class="input-row">
              <input
                type="password"
                name="code"
                placeholder="Access code"
                autocomplete="off"
                autofocus
              />
              <button type="submit">Unlock</button>
            </div>
            {% if error %}<p class="lock-error">{{ error }}</p>{% endif %}
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">EMVN Data Lab</footer>
  </body>
</html>
